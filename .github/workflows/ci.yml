name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install optional PNG headers
        run: sudo apt-get update && sudo apt-get install -y libpng-dev

      - name: License and layout check
        run: python3 tools/check_layout.py

      - name: Build
        run: make -j2

      - name: Release version consistency
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/version.py --check-build build
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/version.py --tag "$REF_NAME"
          fi

      - name: Test
        run: make test

      - name: Sanitizer regression
        run: >-
          g++ -I include -std=c++20 -O1 -g
          -fsanitize=address,undefined -fno-omit-frame-pointer
          src/detector.cpp tests/self_test.cpp
          -o /tmp/mfds_sanitized_tests

      - name: Run sanitizer regression
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: /tmp/mfds_sanitized_tests

  no-libpng:
    name: core-without-libpng
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build without pkg-config dependencies
        run: make PKG_CONFIG=/bin/false -j2

      - name: Test
        run: make PKG_CONFIG=/bin/false test

      - name: Release version without libpng
        run: python3 tools/version.py --check-build build

