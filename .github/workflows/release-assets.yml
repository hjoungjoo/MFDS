name: release-assets
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test with Debian Bookworm ABI
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm-slim bash -ec '
            apt-get update
            apt-get install -y --no-install-recommends g++ make python3 python3-numpy python3-scipy python3-pytest git libpng-dev libegl-dev libgles-dev pkg-config ca-certificates
            git config --global --add safe.directory /src
            python3 tools/check_layout.py
            make -j2 all
            make gpu
            make test
            if [ "$(uname -m)" = aarch64 ]; then export MF_TEST_NEON=1; fi
            PYTHONPATH=integrations/pifinder python3 -m pytest -q integrations/pifinder/tests/test_mf_temporal_reduce.py integrations/pifinder/tests/test_mf_star_only_preprocess.py
            python3 tools/version.py --check-build build
            python3 tools/package_release.py --output dist
          '
      - uses: actions/upload-artifact@v4
        with:
          name: mfds-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
